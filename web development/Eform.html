<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students biodata</title>
</head>
<body style="background-color: cornsilk;">
    <center><h2>Student adimission form</h2></center>
    <form>
        <hr>
        <label>Name of the student:</label>
        <input type="text" placeholder="Enter name"/><br>
        <label>Adimission number</label>
        <input type="text" placeholder="Enter adimission number"/><br><br>
        <label>Date of birth</label>
        <input type="date" placeholder="Enter date"/><br><br>
        <label>Father name</label>
        <input type="text" placeholder="Enter father name"/><br><br>
        <label>Mother name</label>
        <input type="text" placeholder="Enter mother name"/><br><br>
        <label>Contact number</label>
        <input type="number" placeholder="Enter contact number"/><br><br>
        <label>Student mail id</label>
        <input type="mail" placeholder="Enter mail id"/><br><br>
        <label>Mail id password:</label>
        <input type="password" placeholder="Enter your mail password"/><br><br>
        <p>Gender:</p>
        <input type="radio" name="Male" value="Male"/>Male<br><br>
        <input type="radio" name="Female" value="Female"/>Female<br><br>
        <label>Address:</label>
        <textarea name="description" placeholder="Address"></textarea><br><br>
        <p>Choose your course:</p>
        <input type="checkbox" />Html<br><br>
        <input type="checkbox" />Css<br><br>
        <input type="checkbox" />Bootstrap<br><br>
        <input type="checkbox" />Javascript<br><br>
        <p>Programming language:</p>
        <select>
            <option name="Python">Python</option>
            <option name="Java">Java</option>
            <option name="C++">C++</option>
        </select>
        <p>Upload your marksmemo-1:</p>
        <input type="file"/><br>
        <p>Upload your marksmemo-2:</p>
        <input type="file"/><br><br><br>https://
        <a href="https://cdni.iconscout.com/illustration/premium/thumb/done-illustration-svg-download-png-10303332.jpg">
        <input type="button" name="submit" value="submit"/></a>
        <button>Reset</button>

    </form>   
</body>
</html>
