<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Profile Card</title>
    <style>
        body {
            background-image: url("images\ \(1\).jpeg");
            background-repeat: no-repeat;
            background-size: cover;
        
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 50px;
        }

        .profile-card {
            width: 350px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #d1d5db;
            border-radius: 15px;
            text-align: center;
        }

        .profile-image {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        h3 {
            color: #2563eb;
            font-size: 20px;
            font-weight: 400;
            text-align: center;
        }

        .profile-card p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
        }

        .details {
            text-align: left;
            background-color: #f8fafc;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .details p {
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
   <center> <h2>BEHARA COLLEGE OF ENGINEERING<br>
                AND TECHNOLOGY</h2></center>
    <div class="profile-card">
    <div class="profile-image">
    img src="😊"      
    </div>
        <h1>Jassu</h1>
        <h3>ENGINEERING</h3>
        <p>Passionate about Projects.</p>
    </div>
</body>
</html>
